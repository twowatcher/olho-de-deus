name: Atualizar notícias

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_news.py"
      - ".github/workflows/update-news.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar feeds RSS
        run: python scripts/update_news.py
      - name: Salvar notícias atualizadas
        run: |
          if git diff --quiet -- news-dashboard/data/news.json; then
            echo "Sem mudanças."
            exit 0
          fi
          git config user.name "olho-de-deus-news[bot]"
          git config user.email "olho-de-deus-news[bot]@users.noreply.github.com"
          git add news-dashboard/data/news.json
          git commit -m "chore: atualizar manchetes"
          git push